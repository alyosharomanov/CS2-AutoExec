name: Sync master to Forgejo

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push master to Forgejo
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: |
          set -euo pipefail
          git remote add forgejo "https://alyosharomanov:${FORGEJO_TOKEN}@forgejo.folkmicro.com/alyosharomanov/${{ github.event.repository.name }}.git"
          git push forgejo "HEAD:master" --force
